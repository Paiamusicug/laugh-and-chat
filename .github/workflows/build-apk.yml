name: Build Laugh & Chat Supabase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Supabase v3.0.1 project
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="./Laugh_and_Chat_Supabase_v3_0_1_CORRECTED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Supabase v3.0.1 FIXED ZIP was not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "pubspec.yaml" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Supabase project
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/lib/supabase_config.dart"
          test -f "$PROJECT_DIR/assets/logo.png"

          echo "Supabase v3.0.1 project files verified."

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

      - name: Copy Supabase app files
        run: |
          set -e

          cp "$PROJECT_DIR/lib/main.dart" build_app/lib/main.dart
          cp "$PROJECT_DIR/lib/supabase_config.dart" build_app/lib/supabase_config.dart
          cp "$PROJECT_DIR/pubspec.yaml" build_app/pubspec.yaml

          cp -R "$PROJECT_DIR/assets" build_app/assets

          echo "Supabase v3.0.1 app files copied successfully."

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e
          flutter pub get

      - name: Verify Flutter assets
        working-directory: build_app
        run: |
          set -e

          test -f assets/logo.png

          echo "Asset verification passed."

      - name: Build APK
        working-directory: build_app
        run: |
          set -e
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-supabase-v3-0-1
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
