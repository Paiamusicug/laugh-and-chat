name: Build Laugh & Chat Supabase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Supabase v3.0.3 project
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="./Laugh_and_Chat_Supabase_v3_0_3_DEPENDENCIES_STABLE.zip"

          test -f "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "pubspec.yaml" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Verify project files
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/lib/supabase_config.dart"
          test -f "$PROJECT_DIR/assets/logo.png"

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

      - name: Configure Android project
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------
          # settings.gradle / settings.gradle.kts
          # -----------------------------

          settings_candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle")
          ]

          settings = next(
              (p for p in settings_candidates if p.exists()),
              None
          )

          if settings is None:
              raise SystemExit("ERROR: Android settings file not found.")

          text = settings.read_text()

          text = re.sub(
              r'(com\.android\.application["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.12.1\g<2>',
              text
          )

          text = re.sub(
              r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.0\g<2>',
              text
          )

          settings.write_text(text)

          # -----------------------------
          # Gradle 9.3.1
          # -----------------------------

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if wrapper.exists():
              text = wrapper.read_text()

              text = re.sub(
                  r'gradle-[0-9.]+-(bin|all)\.zip',
                  r'gradle-9.3.1-\1.zip',
                  text
              )

              wrapper.write_text(text)

          # -----------------------------
          # Main app compileSdk
          # -----------------------------

          app_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app = next(
              (p for p in app_candidates if p.exists()),
              None
          )

          if app is None:
              raise SystemExit("ERROR: Android app build file not found.")

          text = app.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s*=\s*31',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+31',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*31',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+31',
              'targetSdk 36',
              text
          )

          app.write_text(text)

          print("Main app configured for compileSdk 36.")

          PY

      - name: Copy Supabase source
        run: |
          set -e

          cp "$PROJECT_DIR/lib/main.dart" build_app/lib/main.dart
          cp "$PROJECT_DIR/lib/supabase_config.dart" build_app/lib/supabase_config.dart
          cp "$PROJECT_DIR/pubspec.yaml" build_app/pubspec.yaml

          rm -rf build_app/assets
          cp -R "$PROJECT_DIR/assets" build_app/assets

      - name: FIX FilePicker API
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          text = path.read_text()

          # file_picker 12.x removed FilePicker.platform.
          text = text.replace(
              "FilePicker.platform.pickFiles(",
              "FilePicker.pickFiles("
          )

          path.write_text(text)

          remaining = text.count("FilePicker.platform")

          print("FilePicker API updated.")

          if remaining:
              print(
                  f"WARNING: {remaining} FilePicker.platform references remain."
              )
          else:
              print("No FilePicker.platform references remain.")

          PY

          grep -n "FilePicker" lib/main.dart || true

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e

          flutter pub get

      - name: FIX gallery_saver_plus Android compileSdk
        working-directory: build_app
        run: |
          set -e

          echo "Searching pub cache for gallery_saver_plus..."

          GALLERY_DIRS=$(find "$HOME/.pub-cache" \
            -type d \
            -name "gallery_saver_plus-*" \
            2>/dev/null || true)

          if [ -z "$GALLERY_DIRS" ]; then
            echo "ERROR: gallery_saver_plus was not found in pub cache."
            exit 1
          fi

          for DIR in $GALLERY_DIRS; do
            echo "Found: $DIR"

            find "$DIR/android" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print \
              2>/dev/null || true
          done

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          home = Path.home()

          matches = list(
              home.glob(".pub-cache/hosted/pub.dev/gallery_saver_plus-*/android")
          )

          if not matches:
              raise SystemExit(
                  "ERROR: gallery_saver_plus Android directory not found."
              )

          for android_dir in matches:
              print(f"Patching gallery plugin: {android_dir}")

              for path in android_dir.rglob("*"):
                  if not path.is_file():
                      continue

                  if path.name not in (
                      "build.gradle",
                      "build.gradle.kts"
                  ):
                      continue

                  text = path.read_text()

                  # Replace any explicit Android 31 compileSdk.
                  text = re.sub(
                      r'compileSdk\s*=\s*31',
                      'compileSdk = 36',
                      text
                  )

                  text = re.sub(
                      r'compileSdk\s+31',
                      'compileSdk 36',
                      text
                  )

                  # Replace Flutter's compile SDK reference too.
                  text = re.sub(
                      r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                      'compileSdk = 36',
                      text
                  )

                  text = re.sub(
                      r'compileSdk\s+flutter\.compileSdkVersion',
                      'compileSdk 36',
                      text
                  )

                  path.write_text(text)

                  print(f"PATCHED: {path}")
                  print(
                      "\n".join(
                          line for line in text.splitlines()
                          if "compileSdk" in line
                      )
                  )

          PY

      - name: Verify FilePicker and Gallery fixes
        working-directory: build_app
        run: |
          set -e

          echo "===== FILE PICKER CHECK ====="

          if grep -R "FilePicker.platform" lib; then
            echo "ERROR: Old FilePicker.platform API still exists."
            exit 1
          fi

          echo "FilePicker API is correct."

          echo "===== MAIN APP SDK ====="

          if [ -f android/app/build.gradle.kts ]; then
            grep -n "compileSdk" android/app/build.gradle.kts || true
            grep -n "targetSdk" android/app/build.gradle.kts || true
          else
            grep -n "compileSdk" android/app/build.gradle || true
            grep -n "targetSdk" android/app/build.gradle || true
          fi

          echo "===== GALLERY SAVER SDK ====="

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -type f \
            \( -path "*gallery_saver_plus*/android/build.gradle" \
               -o -path "*gallery_saver_plus*/android/build.gradle.kts" \) \
            -print \
            -exec grep -n "compileSdk" {} \; || true

          test -f assets/logo.png

          echo "All configuration checks completed."

      - name: Build APK
        working-directory: build_app
        run: |
          set -e

          flutter clean
          flutter pub get

          flutter build apk --debug

      - name: Verify APK
        run: |
          set -e

          APK="build_app/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-supabase-v3-0-3
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
