name: Build Laugh & Chat Supabase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Supabase v3.0.3 project
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE="./Laugh_and_Chat_Supabase_v3_0_3_DEPENDENCIES_STABLE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Supabase v3.0.3 DEPENDENCIES STABLE ZIP was not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "pubspec.yaml" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Supabase project
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/lib/supabase_config.dart"
          test -f "$PROJECT_DIR/assets/logo.png"

          echo "Supabase v3.0.3 project files verified."

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

      - name: Configure Android build
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_files = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle")
          ]

          settings = next((p for p in settings_files if p.exists()), None)

          if settings is None:
              raise SystemExit(
                  "ERROR: Neither settings.gradle.kts nor settings.gradle was found."
              )

          print(f"Using Android settings file: {settings}")

          text = settings.read_text()

          text = re.sub(
              r'(com\.android\.application["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.12.1\g<2>',
              text
          )

          text = re.sub(
              r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.0\g<2>',
              text
          )

          settings.write_text(text)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          if wrapper.exists():
              text = wrapper.read_text()

              text = re.sub(
                  r'gradle-[0-9.]+-(bin|all)\.zip',
                  r'gradle-9.3.1-\1.zip',
                  text
              )

              wrapper.write_text(text)

              print("Gradle wrapper configured for Gradle 9.3.1.")

          print("Android build configuration completed.")
          PY

      - name: Copy Supabase app files
        run: |
          set -e

          cp "$PROJECT_DIR/lib/main.dart" build_app/lib/main.dart
          cp "$PROJECT_DIR/lib/supabase_config.dart" build_app/lib/supabase_config.dart
          cp "$PROJECT_DIR/pubspec.yaml" build_app/pubspec.yaml
          cp -R "$PROJECT_DIR/assets" build_app/assets

          echo "Supabase v3.0.3 app files copied successfully."

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e
          flutter pub get

      - name: Verify Flutter assets
        working-directory: build_app
        run: |
          set -e

          test -f assets/logo.png

          echo "Asset verification passed."

      - name: Build APK
        working-directory: build_app
        run: |
          set -e
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-supabase-v3-0-3
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
