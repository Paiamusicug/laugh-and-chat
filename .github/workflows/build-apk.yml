name: Build Laugh & Chat Supabase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Supabase v3.0.3 project
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="./Laugh_and_Chat_Supabase_v3_0_3_DEPENDENCIES_STABLE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Supabase v3.0.3 ZIP was not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "pubspec.yaml" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Supabase project
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/lib/supabase_config.dart"
          test -f "$PROJECT_DIR/assets/logo.png"

          echo "Supabase project files verified."

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

      - name: Configure Android build
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------
          # Android settings
          # -----------------------------

          settings_files = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle")
          ]

          settings = next((p for p in settings_files if p.exists()), None)

          if settings is None:
              raise SystemExit(
                  "ERROR: Android settings.gradle.kts/settings.gradle not found."
              )

          print(f"Using settings file: {settings}")

          text = settings.read_text()

          # Android Gradle Plugin
          text = re.sub(
              r'(com\.android\.application["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.12.1\g<2>',
              text
          )

          # Kotlin
          text = re.sub(
              r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.0\g<2>',
              text
          )

          settings.write_text(text)

          # -----------------------------
          # Gradle 9.3.1
          # -----------------------------

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if wrapper.exists():
              text = wrapper.read_text()

              text = re.sub(
                  r'gradle-[0-9.]+-(bin|all)\.zip',
                  r'gradle-9.3.1-\1.zip',
                  text
              )

              wrapper.write_text(text)

          # -----------------------------
          # App compileSdk / targetSdk
          # -----------------------------

          build_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app_build = next((p for p in build_files if p.exists()), None)

          if app_build is None:
              raise SystemExit(
                  "ERROR: Android app build.gradle.kts/build.gradle not found."
              )

          print(f"Using app build file: {app_build}")

          text = app_build.read_text()

          # Kotlin DSL
          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 36',
              text
          )

          # Groovy fallback
          text = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+flutter\.targetSdkVersion',
              'targetSdk 36',
              text
          )

          # If compileSdk still uses 31, replace it.
          text = re.sub(
              r'compileSdk\s*=\s*31',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+31',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*31',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+31',
              'targetSdk 36',
              text
          )

          app_build.write_text(text)

          print("Main Android app configured for compileSdk 36.")
          print("Main Android app configured for targetSdk 36.")

          PY

      - name: Copy Supabase app files
        run: |
          set -e

          cp "$PROJECT_DIR/lib/main.dart" build_app/lib/main.dart
          cp "$PROJECT_DIR/lib/supabase_config.dart" build_app/lib/supabase_config.dart
          cp "$PROJECT_DIR/pubspec.yaml" build_app/pubspec.yaml

          rm -rf build_app/assets
          cp -R "$PROJECT_DIR/assets" build_app/assets

          echo "Supabase app files copied."

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e

          flutter pub get

      - name: FIX gallery_saver_plus compileSdk
        working-directory: build_app
        run: |
          set -e

          echo "Searching for gallery_saver_plus..."

          FOUND=0

          while IFS= read -r FILE; do
            FOUND=1

            echo "Patching: $FILE"

            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # Kotlin DSL
          text = re.sub(
              r'compileSdk\s*=\s*31',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          # Groovy
          text = re.sub(
              r'compileSdk\s+31',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              text
          )

          path.write_text(text)
          PY

            echo "Patched gallery_saver_plus to compileSdk 36."

            grep -n "compileSdk" "$FILE" || true

          done < <(
            find "$HOME/.pub-cache" \
              -type f \
              \( -path "*gallery_saver_plus*/android/build.gradle" \
                 -o -path "*gallery_saver_plus*/android/build.gradle.kts" \)
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: gallery_saver_plus Android build file was not found."
            exit 1
          fi

          echo "gallery_saver_plus compileSdk fix completed."

      - name: Force all Android plugin modules to compileSdk 36
        working-directory: build_app
        run: |
          set -e

          echo "Checking Flutter pub cache for Android plugins using compileSdk 31..."

          while IFS= read -r FILE; do
            echo "Checking: $FILE"

            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          original = text

          # Fix explicit compileSdk 31
          text = re.sub(
              r'compileSdk\s*=\s*31',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+31',
              'compileSdk 36',
              text
          )

          if text != original:
              path.write_text(text)
              print(f"UPDATED: {path}")
          PY

          done < <(
            find "$HOME/.pub-cache/hosted/pub.dev" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              2>/dev/null
          )

          echo "Android plugin compileSdk check completed."

      - name: Verify Android configuration
        working-directory: build_app
        run: |
          set -e

          echo "===== APP COMPILE SDK ====="

          if [ -f android/app/build.gradle.kts ]; then
            grep -n "compileSdk" android/app/build.gradle.kts || true
            grep -n "targetSdk" android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            grep -n "compileSdk" android/app/build.gradle || true
            grep -n "targetSdk" android/app/build.gradle || true
          fi

          echo "===== GALLERY SAVER PLUS ====="

          find "$HOME/.pub-cache" \
            -type f \
            \( -path "*gallery_saver_plus*/android/build.gradle" \
               -o -path "*gallery_saver_plus*/android/build.gradle.kts" \) \
            -print \
            -exec grep -n "compileSdk" {} \; || true

          echo "===== LOGO ====="

          test -f assets/logo.png

          echo "Android configuration verified."

      - name: Build APK
        working-directory: build_app
        run: |
          set -e

          flutter clean
          flutter pub get

          flutter build apk --debug

      - name: Verify APK
        run: |
          set -e

          APK="build_app/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-supabase-v3-0-3
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
