name: Build Laugh & Chat Supabase APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Supabase v3.0.3 project
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="./Laugh_and_Chat_Supabase_v3_0_3_DEPENDENCIES_STABLE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "pubspec.yaml" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Using Supabase project:"
          echo "$PROJECT_DIR"
          echo "======================================"

      - name: Verify project files
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/lib/supabase_config.dart"
          test -f "$PROJECT_DIR/assets/logo.png"

          echo "Project files verified."

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

          echo "Android project created."

      - name: Configure Android project
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ============================================================
          # SETTINGS / PLUGINS
          # ============================================================

          settings_candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle")
          ]

          settings = next(
              (p for p in settings_candidates if p.exists()),
              None
          )

          if settings is None:
              raise SystemExit(
                  "ERROR: Android settings.gradle(.kts) not found."
              )

          text = settings.read_text()

          # Android Gradle Plugin 8.12.1
          text = re.sub(
              r'(com\.android\.application["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.12.1\g<2>',
              text
          )

          # Kotlin 2.2.0
          text = re.sub(
              r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.0\g<2>',
              text
          )

          settings.write_text(text)

          print(f"Configured: {settings}")

          # ============================================================
          # GRADLE WRAPPER
          # ============================================================

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if wrapper.exists():
              text = wrapper.read_text()

              text = re.sub(
                  r'gradle-[0-9.]+-(bin|all)\.zip',
                  r'gradle-9.3.1-\1.zip',
                  text
              )

              wrapper.write_text(text)

              print("Gradle wrapper configured for 9.3.1.")

          # ============================================================
          # MAIN APP SDK
          # ============================================================

          app_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app = next(
              (p for p in app_candidates if p.exists()),
              None
          )

          if app is None:
              raise SystemExit(
                  "ERROR: android/app/build.gradle(.kts) not found."
              )

          text = app.read_text()

          # Flutter compileSdk -> 36
          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              text
          )

          # Explicit old compile SDK values
          text = re.sub(
              r'compileSdk\s*=\s*31\b',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+31\b',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'compileSdkVersion\s*=?\s*31\b',
              'compileSdkVersion 36',
              text
          )

          # Flutter targetSdk -> 36
          text = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+flutter\.targetSdkVersion',
              'targetSdk 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*31\b',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+31\b',
              'targetSdk 36',
              text
          )

          text = re.sub(
              r'targetSdkVersion\s*=?\s*31\b',
              'targetSdkVersion 36',
              text
          )

          app.write_text(text)

          print(f"Main Android app configured: {app}")

          PY

      - name: Copy Supabase source
        run: |
          set -e

          cp "$PROJECT_DIR/lib/main.dart" \
             build_app/lib/main.dart

          cat > build_app/lib/supabase_config.dart <<EOF
const String supabaseUrl = 'https://knedortbcjaaprmwuqqg.supabase.co';
const String supabasePublishableKey = '${{ secrets.SUPABASE_PUBLISHABLE_KEY }}';
EOF

          cp "$PROJECT_DIR/pubspec.yaml" \
             build_app/pubspec.yaml

          rm -rf build_app/assets

          cp -R "$PROJECT_DIR/assets" \
             build_app/assets

          echo "Supabase source copied."

      - name: Fix FilePicker API
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")

          text = path.read_text()

          # file_picker 12.x uses FilePicker.pickFiles()
          # instead of FilePicker.platform.pickFiles()

          text = text.replace(
              "FilePicker.platform.pickFiles(",
              "FilePicker.pickFiles("
          )

          path.write_text(text)

          if "FilePicker.platform" in text:
              print("WARNING: FilePicker.platform references remain.")
          else:
              print("FilePicker API successfully updated.")

          PY

          echo "===== FILE PICKER REFERENCES ====="
          grep -n "FilePicker" lib/main.dart || true

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e

          flutter pub get

          echo "Dependencies installed successfully."

      - name: Verify dependencies
        working-directory: build_app
        run: |
          set -e

          echo "===== FLUTTER VERSION ====="
          flutter --version

          echo "===== PUB DEPENDENCIES ====="
          flutter pub deps --style=compact | head -100 || true

          echo "Dependencies verified."

      - name: Final Android SDK configuration
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ============================================================
          # FORCE MAIN APP SDK 36
          # ============================================================

          app_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app = next(
              (p for p in app_candidates if p.exists()),
              None
          )

          if app is None:
              raise SystemExit(
                  "ERROR: Main Android build file not found."
              )

          text = app.read_text()

          # compileSdk
          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'compileSdk\s*=\s*31\b',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+31\b',
              'compileSdk 36',
              text
          )

          text = re.sub(
              r'compileSdkVersion\s*=?\s*31\b',
              'compileSdkVersion 36',
              text
          )

          # targetSdk
          text = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+flutter\.targetSdkVersion',
              'targetSdk 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*31\b',
              'targetSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s+31\b',
              'targetSdk 36',
              text
          )

          text = re.sub(
              r'targetSdkVersion\s*=?\s*31\b',
              'targetSdkVersion 36',
              text
          )

          app.write_text(text)

          print("Main Android application forced to SDK 36.")

          # ============================================================
          # PATCH GALLERY_SAVER_PLUS
          # ============================================================

          pub_cache = Path.home() / ".pub-cache"

          gallery_dirs = list(
              pub_cache.glob(
                  "hosted/pub.dev/gallery_saver_plus-*/android"
              )
          )

          if not gallery_dirs:
              raise SystemExit(
                  "ERROR: gallery_saver_plus Android directory not found."
              )

          print("======================================")
          print("gallery_saver_plus directories found:")
          for directory in gallery_dirs:
              print(directory)
          print("======================================")

          for android_dir in gallery_dirs:

              gradle_files = list(android_dir.rglob("*.gradle"))
              gradle_files += list(android_dir.rglob("*.gradle.kts"))

              if not gradle_files:
                  raise SystemExit(
                      f"ERROR: No Gradle files found in {android_dir}"
                  )

              for path in gradle_files:

                  text = path.read_text()

                  # ----------------------------------------------------
                  # OLD GRADLE:
                  # compileSdkVersion 31
                  # compileSdkVersion = 31
                  # ----------------------------------------------------

                  text = re.sub(
                      r'\bcompileSdkVersion\s*=?\s*31\b',
                      'compileSdkVersion 36',
                      text
                  )

                  # ----------------------------------------------------
                  # MODERN GRADLE:
                  # compileSdk = 31
                  # compileSdk 31
                  # ----------------------------------------------------

                  text = re.sub(
                      r'\bcompileSdk\s*=\s*31\b',
                      'compileSdk = 36',
                      text
                  )

                  text = re.sub(
                      r'\bcompileSdk\s+31\b',
                      'compileSdk 36',
                      text
                  )

                  # ----------------------------------------------------
                  # FLUTTER SDK REFERENCES
                  # ----------------------------------------------------

                  text = re.sub(
                      r'\bcompileSdkVersion\s+flutter\.compileSdkVersion\b',
                      'compileSdkVersion 36',
                      text
                  )

                  text = re.sub(
                      r'\bcompileSdk\s*=\s*flutter\.compileSdkVersion\b',
                      'compileSdk = 36',
                      text
                  )

                  text = re.sub(
                      r'\bcompileSdk\s+flutter\.compileSdkVersion\b',
                      'compileSdk 36',
                      text
                  )

                  path.write_text(text)

                  print(f"PATCHED: {path}")

                  for line in text.splitlines():
                      if "compileSdk" in line:
                          print("   " + line.strip())

          PY

      - name: Verify final Android configuration
        working-directory: build_app
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "FILE PICKER CHECK"
          echo "======================================"

          if grep -R "FilePicker.platform" lib; then
            echo "ERROR: Old FilePicker.platform API still exists."
            exit 1
          fi

          echo "PASS: FilePicker API is correct."

          echo ""
          echo "======================================"
          echo "MAIN APP SDK CHECK"
          echo "======================================"

          if [ -f android/app/build.gradle.kts ]; then
            grep -n "compileSdk" android/app/build.gradle.kts || true
            grep -n "targetSdk" android/app/build.gradle.kts || true
          else
            grep -n "compileSdk" android/app/build.gradle || true
            grep -n "targetSdk" android/app/build.gradle || true
          fi

          echo ""
          echo "======================================"
          echo "GALLERY SAVER SDK CHECK"
          echo "======================================"

          GALLERY_FILES=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -type f \
            \( -path "*gallery_saver_plus*/android/*.gradle" \
               -o -path "*gallery_saver_plus*/android/*.gradle.kts" \) \
            2>/dev/null || true)

          if [ -z "$GALLERY_FILES" ]; then
            echo "ERROR: gallery_saver_plus Gradle file not found."
            exit 1
          fi

          echo "$GALLERY_FILES"

          echo "$GALLERY_FILES" | while read -r FILE; do
            echo "---- $FILE ----"
            grep -n "compileSdk" "$FILE" || true
          done

          echo ""
          echo "======================================"
          echo "ASSET CHECK"
          echo "======================================"

          test -f assets/logo.png

          echo "PASS: assets/logo.png exists."

          echo ""
          echo "======================================"
          echo "CONFIGURATION CHECKS PASSED"
          echo "======================================"

      - name: Build APK
        working-directory: build_app
        run: |
          set -e

          echo "======================================"
          echo "BUILDING LAUGH & CHAT APK"
          echo "======================================"

          flutter build apk --debug

          echo ""
          echo "APK BUILD COMPLETED."

      - name: Verify APK
        run: |
          set -e

          APK="build_app/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-supabase-v3-0-3
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
