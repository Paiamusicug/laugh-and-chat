name: Build Laugh & Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Laugh & Chat project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No Laugh & Chat ZIP file found."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name pubspec.yaml -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create complete Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

      - name: Copy Laugh & Chat files
        run: |
          cp "$PROJECT_DIR/lib/main.dart" build_app/lib/main.dart
          cp "$PROJECT_DIR/pubspec.yaml" build_app/pubspec.yaml

          mkdir -p build_app/android/app

          cp "$PROJECT_DIR/android/app/google-services.json" \
             build_app/android/app/google-services.json

      - name: Configure Firebase Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_candidates = [
              Path("build_app/android/settings.gradle.kts"),
              Path("build_app/android/settings.gradle"),
          ]

          app_candidates = [
              Path("build_app/android/app/build.gradle.kts"),
              Path("build_app/android/app/build.gradle"),
          ]

          settings = next((p for p in settings_candidates if p.exists()), None)
          app = next((p for p in app_candidates if p.exists()), None)

          if settings is None:
              raise SystemExit(
                  "Could not find settings.gradle or settings.gradle.kts"
              )

          if app is None:
              raise SystemExit(
                  "Could not find app/build.gradle or app/build.gradle.kts"
              )

          settings_text = settings.read_text()
          app_text = app.read_text()

          if "com.google.gms.google-services" not in settings_text:
              if settings.suffix == ".kts":
                  plugin_line = (
                      '    id("com.google.gms.google-services") '
                      'version "4.5.0" apply false'
                  )
              else:
                  plugin_line = (
                      '    id "com.google.gms.google-services" '
                      'version "4.5.0" apply false'
                  )

              if "plugins {" not in settings_text:
                  raise SystemExit("No plugins block found in settings file.")

              settings_text = settings_text.replace(
                  "plugins {",
                  "plugins {\n" + plugin_line,
                  1
              )

              settings.write_text(settings_text)

          if "com.google.gms.google-services" not in app_text:
              if app.suffix == ".kts":
                  plugin_line = '    id("com.google.gms.google-services")'
              else:
                  plugin_line = '    id "com.google.gms.google-services"'

              if "plugins {" not in app_text:
                  raise SystemExit("No plugins block found in app file.")

              app_text = app_text.replace(
                  "plugins {",
                  "plugins {\n" + plugin_line,
                  1
              )

              app.write_text(app_text)

          print("Firebase configuration complete.")
          print("Settings file:", settings)
          print("App Gradle file:", app)
          PY

      - name: Get dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Show Android signing fingerprints
        working-directory: build_app
        run: |
          echo "SHA-1:"
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep "SHA1:"

          echo "SHA-256:"
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep "SHA256:"

      - name: Build APK
        working-directory: build_app
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
