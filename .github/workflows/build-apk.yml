name: Build Laugh & Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Extract Laugh & Chat v2.2.0
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE="./Laugh_and_Chat_v2_2_0_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Laugh_and_Chat_v2_2_0_FIXED.zip was not found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name pubspec.yaml -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -f "$PROJECT_DIR/assets/logo.png"

          echo "Laugh & Chat v2.2.0 project verified."

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.humblet \
            --project-name laughandchat \
            build_app

      - name: Copy Laugh & Chat source
        run: |
          set -e

          cp "$PROJECT_DIR/lib/main.dart" build_app/lib/main.dart
          cp "$PROJECT_DIR/pubspec.yaml" build_app/pubspec.yaml

          rm -rf build_app/assets
          cp -R "$PROJECT_DIR/assets" build_app/assets

          echo "Source copied successfully."

      - name: Get dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Verify Flutter assets
        working-directory: build_app
        run: |
          set -e

          test -f assets/logo.png

          echo "Logo verification passed."

      - name: Build APK
        working-directory: build_app
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laugh-and-chat-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
